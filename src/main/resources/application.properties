```properties
spring.application.name=billing-software

server.port=8080

# DATABASE CONFIGURATION - POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/billingdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:db-admin}
spring.datasource.password=${DB_PASSWORD:adminuser}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DONT CREATE TABLES USING JPA
spring.jpa.hibernate.ddl-auto=none

# DATABASE MIGRATION TOOL
spring.flyway.enabled=true

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
```
