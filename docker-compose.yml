x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:16-alpine
    container_name: billing-postgres

    environment:
      POSTGRES_DB: billingdb
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=30"

    volumes:
      - billing-postgres-data:/var/lib/postgresql/data

    networks:
      - billing-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"

    # Prefer killing this container over critical host processes.
    oom_score_adj: 500

    restart: "no"

    security_opt:
      - no-new-privileges:true

    logging: *default-logging


  billing-app:
    image: ghcr.io/karmarankartik/billing-software:${IMAGE_TAG:?IMAGE_TAG is required}

    container_name: billing-app

    environment:
      DB_URL: jdbc:postgresql://billing-postgres:5432/billingdb
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "8080:8080"

    networks:
      - billing-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.75"

    # Prefer killing the application over critical host processes.
    oom_score_adj: 500

    restart: "no"

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  billing-postgres-data:
    name: billing-postgres-data


networks:
  billing-network:
    name: billing-network
